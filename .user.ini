; ⚡ سایت‌ساز برند سهند سرویس — تنظیمات بهینه عملکرد برای PHP 8.3
; ====================================================================
; این فایل توسط PHP-FPM / LiteSpeed / CGI هاست‌های اشتراکی (cPanel)
; به‌صورت خودکار خوانده می‌شود. اعمال تغییرات تا ۵ دقیقه طول می‌کشد
; (user_ini.cache_ttl). اگر هاست شما Apache mod_php است این فایل نادیده
; گرفته می‌شود و ضرری ندارد — تنظیمات معادل باید از MultiPHP INI Editor
; اعمال شود.
;
; 📌 توجه: مقادیر opcache فقط در صورت مجاز بودن در سطح هاست اعمال می‌شوند.

; 🧠 حافظه و زمان اجرا — کافی برای تولید کامل مقالات و ساخت سایت برند
memory_limit=256M
max_execution_time=120
max_input_time=180

; 📤 آپلود — هماهنگ با سقف ۱۰ مگابایت سایت‌ساز + حاشیه امن
upload_max_filesize=12M
post_max_size=14M

; ⚡ OPcache — شتاب‌دهنده بایت‌کد PHP (۲ تا ۵ برابر سرعت)
opcache.enable=1
opcache.revalidate_freq=60
opcache.max_wasted_percentage=10

; 🗂️ کش مسیر فایل‌ها — کاهش I/O در هر درخواست
realpath_cache_size=4096k
realpath_cache_ttl=600

; 🔐 سخت‌سازی نشست‌ها
session.use_strict_mode=1
session.gc_maxlifetime=7200

; 🔤 انکودینگ پیش‌فرض
default_charset=UTF-8

; 🌐 منطقه زمانی
date.timezone=Asia/Tehran
