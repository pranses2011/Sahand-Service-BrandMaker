  <!-- عنوان -->
  <text x="600" y="580" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="40" font-weight="700" fill="#ffffff">مقاله بدون تصویر شاخص</text>
  <text x="600" y="620" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="19" fill="#cfe2f6">نمایندگی خدمات پس از فروش لوازم خانگی</text>
  <!-- خط تزئینی -->
  <rect x="520" y="636" width="160" height="4" rx="2" fill="#ffffff" opacity="0.65"/>
