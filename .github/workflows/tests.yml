# 🧪 CI سایت‌ساز سهند سرویس — v2.33
# گزارش تحلیل (P0-۲): «هیچ تست، CI در مخزن نیست — هر رگرسیون فقط با کلیک دستی پیدا می‌شود»
# ۱) لینت سینتکس همه فایل‌های PHP (بدون نیاز به دیتابیس)
# ۲) تست‌های بومی tests/run.php روی MariaDB (واحد + انطباق رندرگرها)
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🧹 لینت PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: بررسی سینتکس همه فایل‌های PHP
        run: |
          FAIL=0
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT+1))
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "⛔ خطای سینتکس: $f"
              php -l "$f" || true
              FAIL=1
            fi
          done < <(find . -name '*.php' -not -path './tools/*' -not -path './vendor/*' -type f)
          echo "🧹 $COUNT فایل بررسی شد"
          exit $FAIL

  tests:
    name: 🧪 تست‌های بومی (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: brandmaker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, gd, mbstring
          coverage: none

      - name: ساخت config.local.php محیط CI
        run: |
          cat > config.local.php <<'PHP'
          <?php
          define('DB_HOST_VALUE', '127.0.0.1');
          define('DB_PORT_VALUE', 3306);
          define('DB_NAME_VALUE', 'brandmaker_test');
          define('DB_USER_VALUE', 'root');
          define('DB_PASS_VALUE', 'root');
          PHP

      - name: انتظار برای دیتابیس + ایمپورت اسکیما
        run: |
          for i in $(seq 1 30); do
            if mariadb -h 127.0.0.1 -uroot -proot -e "SELECT 1;" > /dev/null 2>&1; then break; fi
            sleep 2
          done
          mariadb -h 127.0.0.1 -uroot -proot brandmaker_test < database.sql
          mariadb -h 127.0.0.1 -uroot -proot brandmaker_test -e "
            INSERT INTO users (username, password_hash, full_name, role, is_active)
            VALUES ('admin', '\$2y\$10\$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', 'مدیر تست', 'admin', 1)
            ON DUPLICATE KEY UPDATE is_active=1;
            SELECT 'seed ok';"

      - name: اجرای تست‌ها
        run: php tests/run.php

      - name: خلاصه
        if: always()
        run: echo "🧪 تست‌های بومی اجرا شد — برای جزئیات لاگ بالا را ببینید"
