<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>آفلاین هستید — {{BRAND_NAME_FA}}</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        :root { --brand: {{THEME_COLOR}}; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Vazirmatn, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, .08);
            padding: 48px 32px;
            max-width: 440px;
            width: 100%;
        }
        .icon { font-size: 64px; margin-bottom: 18px; }
        h1 { font-size: 21px; font-weight: 800; margin-bottom: 10px; }
        p { font-size: 14.5px; line-height: 2; color: #475569; margin-bottom: 8px; }
        .brand { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
        .btn {
            display: inline-block;
            background: var(--brand, #1e40af);
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            padding: 13px 34px;
            border-radius: 12px;
            margin-top: 8px;
            transition: transform .15s, box-shadow .15s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 64, 175, .3); }
        .hint { font-size: 12px; color: #94a3b8; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>صفحه‌هایی که قبلاً بازدید کرده‌اید به‌صورت آفلاین در دسترس‌اند؛ برای دیدن جدیدترین محتوا اتصال خود را بررسی کنید.</p>
        <div class="brand">🏷️ {{BRAND_NAME_FA}}</div>
        <a href="/" class="btn">↻ تلاش مجدد</a>
        <div class="hint">این صفحه به‌صورت خودکار هنگام قطع اینترنت نمایش می‌یابد.</div>
    </div>
</body>
</html>
